<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>

    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/img/favicon-192.png' | relative_url }}" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/assets/img/site.webmanifest' | relative_url }}">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="only light">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    <nav class="topnav">
      <div class="nav-inner">
        <a class="brand" href="#top" aria-label="Home">
          <span class="brand-first">Carlo</span>
          <span class="brand-last">Lombardo</span><span class="brand-dot">.</span>
        </a>
        <div class="nav-links" id="mobile-menu">
          <a class="nav-link" href="#working-papers">Working papers</a>
          <a class="nav-link" href="#publications">Publications</a>
          <a class="nav-link" href="#work-in-progress">Work in progress</a>
          <a class="nav-link" href="#predoc">Pre-doctoral</a>
        </div>
        <button class="hamburger" id="menu-btn"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="mobile-menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <main id="top" class="container">
      {{ content }}
    </main>  
    
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Mobile menu toggle
      const btn = document.getElementById("menu-btn");
      const menu = document.getElementById("mobile-menu");
      if (btn && menu) {
        btn.addEventListener("click", () => {
          const expanded = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", String(!expanded));
          menu.classList.toggle("is-open");
        });
        // Close when a nav link is tapped
        menu.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", () => {
            btn.setAttribute("aria-expanded", "false");
            menu.classList.remove("is-open");
          });
        });
        // Close when clicking outside the nav
        document.addEventListener("click", (e) => {
          if (!btn.contains(e.target) && !menu.contains(e.target)) {
            btn.setAttribute("aria-expanded", "false");
            menu.classList.remove("is-open");
          }
        });
      }

      // Active section highlighting
      const links = Array.from(document.querySelectorAll(".nav-link[href^='#']"));
      const targets = links
        .map(a => document.querySelector(a.getAttribute("href")))
        .filter(Boolean);

      const setActive = (id) => {
        links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + id));
      };

      const nav = document.querySelector(".topnav");
      let clickedId = null, clickTimer = null;

      const update = () => {
        if (!targets.length || clickedId) return;
        const doc = document.documentElement;
        const navH = nav ? nav.offsetHeight : 0;
        const vh = window.innerHeight;
        const maxScroll = doc.scrollHeight - vh;
        const remaining = Math.max(0, maxScroll - window.scrollY);
        const stretch = Math.min(vh * 0.6, maxScroll);
        const t = maxScroll > 2 ? Math.min(1, Math.max(0, 1 - remaining / stretch)) : 0;
        const line = navH + (vh - navH) * (0.25 + 0.75 * t) - 2;
        let current = null;
        targets.forEach(s => { if (s.getBoundingClientRect().top <= line) current = s; });
        if (current) setActive(current.id);
        else links.forEach(a => a.classList.remove("active"));
      };

      links.forEach(a => a.addEventListener("click", () => {
        clickedId = a.getAttribute("href").slice(1);
        setActive(clickedId);
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickedId = null; }, 1200);
      }));
      window.addEventListener("scrollend", () => {
        if (clickedId) { clearTimeout(clickTimer); clickTimer = setTimeout(() => { clickedId = null; }, 150); }
      });
      ["wheel", "touchstart", "keydown"].forEach(ev =>
        window.addEventListener(ev, () => { if (clickedId) { clickedId = null; update(); } }, { passive: true }));

      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
      document.addEventListener("toggle", update, true);
      update();
    });
    </script>
    
  </body>
</html>
